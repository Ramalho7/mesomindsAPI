name: Run Tests

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

jobs:
  run-tests:
    name: Run Tests - CI
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.3
        extensions: mbstring, pdo, bcmath, intl, pcntl, zip
        ini-values: post_max_size=256M, upload_max_filesize=256M, memory_limit=512M
        coverage: xdebug

    - name: Debug PHP & Composer
      run: |
        php -v
        composer self-update --stable
        composer diagnose || true

    - name: Show lock/platform info
      run: |
        php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION.PHP_EOL;'
        composer show symfony/filesystem --no-interaction || true
        git --no-pager show -s --format="%h %ci %an" composer.lock || true

    - name: Install Composer dependencies
      run: composer install --no-progress --prefer-dist --optimize-autoloader --no-interaction

    - name: Set up environment
      run: cp .env.testing .env

    - name: Generate application key
      run: php artisan key:generate

    - name: Run migrations
      run: php artisan migrate --force

    - name: Run tests
      run: ./vendor/bin/phpunit --coverage-text --colors=never
