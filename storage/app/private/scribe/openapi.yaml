    name: Usuários
    description: "Filtros disponíveis:\n- name: Filtra por nome (fullText)\n- email: Filtra por email (fullText)\n- role: Filtra por tipo de usuário\n- status: Filtra por status do usuário\n- created_at: Filtra por data de criação\n- updated_at: Filtra por data de atualização\n- deleted_at: Filtra por data de exclusão\n- created_by: Filtra por ID do criador\n- updated_by: Filtra por ID do último editor\n- search: Busca geral em nome e email"
paths:
  /api/register:
    post:
      summary: 'Self-register de usuários na plataforma.'
      operationId: selfRegisterDeUsuriosNaPlataforma
      description: ''
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  message: 'Cadastro realizado com sucesso'
                  token: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
                  user:
                    id: 4
                    nome: 'Jessica Jones'
                    email: jessica@example.com
                    tipo: admin
                    status: Ativo
                    criador: null
                    created_at: '2025-11-28T12:34:56.000000Z'
                    updated_at: '2025-11-28T12:34:56.000000Z'
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Cadastro realizado com sucesso'
                  token:
                    type: string
                    example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 4
                      nome:
                        type: string
                        example: 'Jessica Jones'
                      email:
                        type: string
                        example: jessica@example.com
                      tipo:
                        type: string
                        example: admin
                      status:
                        type: string
                        example: Ativo
                      criador:
                        type: string
                        example: null
                      created_at:
                        type: string
                        example: '2025-11-28T12:34:56.000000Z'
                      updated_at:
                        type: string
                        example: '2025-11-28T12:34:56.000000Z'
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Usuários autenticados devem usar a rota /api/users para criar novos usuários'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Usuários autenticados devem usar a rota /api/users para criar novos usuários'
        500:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Erro ao realizar cadastro'
                  error: 'mensagem da exceção'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Erro ao realizar cadastro'
                  error:
                    type: string
                    example: 'mensagem da exceção'
      tags:
        - Autenticação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: ''
                  example: architecto
                email:
                  type: string
                  description: 'Email válido do usuário. Must be a valid email address.'
                  example: jessica@example.com
                password:
                  type: string
                  description: 'Senha (mínimo 8 caracteres). Must be at least 8 characters.'
                  example: secret123
                role:
                  type: string
                  description: ''
                  example: teacher
                  enum:
                    - student
                    - teacher
              required:
                - name
                - email
                - password
                - role
      security: []
