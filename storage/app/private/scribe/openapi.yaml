          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Credenciais inválidas'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Credenciais inválidas'
        403:
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  -
                    description: ''
                    type: object
                    example:
                      success: false
                      message: 'Usuário inativo'
                    properties:
                      success:
                        type: boolean
                        example: false
                      message:
                        type: string
                        example: 'Usuário inativo'
                  -
                    description: ''
                    type: object
                    example:
                      success: false
                      message: 'Usuário bloqueado'
                    properties:
                      success:
                        type: boolean
                        example: false
                      message:
                        type: string
                        example: 'Usuário bloqueado'
        500:
