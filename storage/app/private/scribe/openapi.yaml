          content:
            application/json:
              schema:
                type: object
                example:
                  success: false
                  message: 'Erro ao realizar login'
                  error: 'mensagem da exceção'
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 'Erro ao realizar login'
                  error:
                    type: string
                    example: 'mensagem da exceção'
      tags:
        - Autenticação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Email do usuário cadastrado. Must be a valid email address. The <code>email</code> of an existing record in the system_users table.'
                  example: usuario@exemplo.com
                password:
                  type: string
                  description: 'Senha do usuário. Must be at least 6 characters.'
                  example: senha123
              required:
                - email
                - password
      security: []
